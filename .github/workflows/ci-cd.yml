name: CI/CD with Gradle  # 워크플로우 이름

on:
  push:
    branches: [ "main" ]   # main 브랜치에 push될 때 워크플로우 실행
  pull_request:
    branches: [ "main" ]   # main 브랜치 대상 PR이 열릴 때 워크플로우 실행

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 소스코드 체크아웃
      - uses: actions/checkout@v3  # 레포지토리 소스를 가져옴

      # 2. JDK 17 설치
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'           # Java 버전
          distribution: "adopt"

      # 3. Gradle 빌드 (테스트 제외)
      - name: Build with Gradle
        run: |
          chmod +x ./gradlew          # gradlew 실행 권한 부여
          ./gradlew clean build -x test  # 테스트 제외하고 빌드

      # 4. Docker 이미지 빌드 & DockerHub 푸시
      - name: Docker build & push to docker repo
        run: |
          # DockerHub 로그인
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

          # Docker 이미지 빌드
          docker build -f Dockerfile -t ${{ secrets.DOCKER_REPO }}:v1 .

          # DockerHub에 푸시
          docker push ${{ secrets.DOCKER_REPO }}:v1

      # 5. 오라클 서버에 SSH 접속 후 배포
      - name: Deploy to server
        uses: appleboy/ssh-action@master
        id: deploy
        with:
          host: ${{ secrets.ORACLE_HOST }}           # 오라클 클라우드 서버 Public IP
          username: ${{ secrets.ORACLE_USERNAME }}   # SSH 로그인 사용자
          key: ${{ secrets.ORACLE_PRIVATE_KEY }}     # SSH 개인키 (GitHub Secrets)
          envs: GITHUB_SHA
          script: |
            cd compose
            # 기존 컨테이너 강제 제거
            sudo docker rm -f $(docker ps -qa)
            # 최신 DockerHub 이미지 가져오기
            sudo docker pull ${{ secrets.DOCKER_REPO }}:v1
            # Docker Compose로 컨테이너 빌드 & 실행
            docker-compose up --build -d
            # 사용하지 않는 이미지 삭제
            docker image prune -f